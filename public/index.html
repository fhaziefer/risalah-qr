<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate QR LIM Pusat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar untuk tampilan dark mode yang lebih elegan */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #09090b; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
        
        /* Memperhalus tampilan select dropdown default browser */
        select { color-scheme: dark; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-300 min-h-screen p-6 md:p-12 font-sans selection:bg-zinc-800 selection:text-white">

    <div class="max-w-4xl mx-auto bg-zinc-900/50 backdrop-blur-sm p-8 md:p-10 rounded-2xl border border-zinc-800/80 shadow-2xl">
        
        <div class="mb-10 text-center">
            <h1 class="text-3xl font-light text-white tracking-wide">Generate QR <span class="font-bold">LIM Pusat</span></h1>
            <p class="text-sm text-zinc-500 mt-2 tracking-widest">Risalah LIM Lirboyo</p>
        </div>
        
        <form id="qrForm" class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="space-y-5">
                <div>
                    <label class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2">Nomor Surat</label>
                    <input type="text" id="nomorSurat" required class="block w-full rounded-lg bg-zinc-950 border border-zinc-800 p-3 text-zinc-200 focus:outline-none focus:ring-1 focus:ring-zinc-500 focus:border-zinc-500 transition-all" value="001">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2">Kode Surat</label>
                    <select id="kodeSurat" required class="block w-full rounded-lg bg-zinc-950 border border-zinc-800 p-3 text-zinc-200 focus:outline-none focus:ring-1 focus:ring-zinc-500 focus:border-zinc-500 transition-all cursor-pointer">
                        <option value="A">A - Surat Keputusan</option>
                        <option value="B">B - Surat Undangan</option>
                        <option value="C">C - Surat Permohonan</option>
                        <option value="D">D - Surat Pemberitahuan</option>
                        <option value="E">E - Surat Instruksi</option>
                        <option value="F">F - Surat Pengantar</option>
                        <option value="G">G - Surat Jawaban Permohonan</option>
                        <option value="H">H - Surat Tugas/Mandat Tugas</option>
                        <option value="I">I - Surat Kuasa</option>
                        <option value="J">J - Surat Rekomendasi</option>
                        <option value="K">K - Surat Pernyataan</option>
                        <option value="L">L - Surat Peringatan</option>
                        <option value="M">M - Surat Pengumuman</option>
                        <option value="N">N - Surat Perjanjian</option>
                        <option value="O">O - Surat Edaran</option>
                        <option value="P">P - Berita Acara</option>
                        <option value="Q">Q - Nota Dinas</option>
                        <option value="R">R - Surat Keterangan</option>
                        <option value="S">S - Laporan</option>
                        <option value="T">T - Notulen Rapat</option>
                    </select>
                </div>
                
                <div class="pt-4 mt-6 border-t border-zinc-800/50">
                    <p class="text-[10px] text-zinc-600 mb-4 font-bold uppercase tracking-[0.2em]">Data Permanen</p>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-medium text-zinc-500 mb-1.5">Kode Kepengurusan</label>
                            <input type="text" id="kodeKepengurusan" value="PP" readonly class="block w-full rounded-md border border-zinc-800/50 bg-zinc-900/50 p-2.5 text-zinc-500 cursor-not-allowed text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-zinc-500 mb-1.5">Tingkat Kepengurusan</label>
                            <input type="text" id="tingkatKepengurusan" value="Pengurus Pusat" readonly class="block w-full rounded-md border border-zinc-800/50 bg-zinc-900/50 p-2.5 text-zinc-500 cursor-not-allowed text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-zinc-500 mb-1.5">Daerah Kepengurusan</label>
                            <input type="text" id="daerahKepengurusan" value="Pondok Pesantren Lirboyo" readonly class="block w-full rounded-md border border-zinc-800/50 bg-zinc-900/50 p-2.5 text-zinc-500 cursor-not-allowed text-sm">
                        </div>
                    </div>
                </div>
            </div>

            <div class="space-y-6">
                <div class="p-5 rounded-xl border border-zinc-800/80 bg-zinc-900/30 space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2">Jabatan Ketua</label>
                        <select id="ketua" class="block w-full rounded-lg bg-zinc-950 border border-zinc-800 p-3 text-zinc-200 focus:outline-none focus:ring-1 focus:ring-zinc-500 focus:border-zinc-500 transition-all cursor-pointer">
                            <option value="Ketua Umum">Ketua Umum</option>
                            <option value="Ketua Satu">Ketua Satu</option>
                            <option value="Ketua Dua">Ketua Dua</option>
                            <option value="Ketua Tiga">Ketua Tiga</option>
                            <option value="Ketua Empat">Ketua Empat</option>
                            <option value="Ketua Lima">Ketua Lima</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-zinc-500 uppercase tracking-wider mb-2">Nama Ketua</label>
                        <input type="text" id="ketuaName" readonly class="block w-full rounded-lg border border-zinc-800/50 bg-zinc-900 p-3 text-white font-medium cursor-default focus:outline-none">
                    </div>
                </div>

                <div class="p-5 rounded-xl border border-zinc-800/80 bg-zinc-900/30 space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2">Jabatan Sekretaris</label>
                        <select id="sekretaris" class="block w-full rounded-lg bg-zinc-950 border border-zinc-800 p-3 text-zinc-200 focus:outline-none focus:ring-1 focus:ring-zinc-500 focus:border-zinc-500 transition-all cursor-pointer">
                            <option value="Sekretaris Umum">Sekretaris Umum</option>
                            <option value="Sekretaris Satu">Sekretaris Satu</option>
                            <option value="Sekretaris Dua">Sekretaris Dua</option>
                            <option value="Sekretaris Tiga">Sekretaris Tiga</option>
                            <option value="Sekretaris Empat">Sekretaris Empat</option>
                            <option value="Sekretaris Lima">Sekretaris Lima</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-zinc-500 uppercase tracking-wider mb-2">Nama Sekretaris</label>
                        <input type="text" id="sekretarisName" readonly class="block w-full rounded-lg border border-zinc-800/50 bg-zinc-900 p-3 text-white font-medium cursor-default focus:outline-none">
                    </div>
                </div>
            </div>

            <div class="col-span-1 md:col-span-2 pt-6">
                <button type="submit" id="submitBtn" class="w-full flex justify-center py-4 px-4 rounded-xl text-sm font-bold text-zinc-900 bg-zinc-100 hover:bg-white focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-zinc-950 focus:ring-zinc-300 transition-all duration-300 uppercase tracking-widest shadow-[0_0_15px_rgba(255,255,255,0.1)] hover:shadow-[0_0_25px_rgba(255,255,255,0.2)]">
                    Generate Berkas
                </button>
            </div>
        </form>

        <div id="message" class="hidden mt-6 p-4 rounded-lg text-sm border font-medium text-center tracking-wide"></div>

        <div id="resultSection" class="hidden mt-10 pt-10 border-t border-zinc-800">
            <h2 class="text-xl font-light text-white mb-8 text-center tracking-wide">Hasil Berkas</h2>
            
            <div class="flex justify-center mb-10">
                <a id="downloadZip" href="#" class="inline-flex items-center px-6 py-3 border border-zinc-700 rounded-lg text-sm font-semibold text-white bg-zinc-800 hover:bg-zinc-700 hover:border-zinc-500 transition-all duration-300 shadow-lg">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    Download File ZIP
                </a>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-8 text-center">
                <div class="flex flex-col items-center">
                    <p class="text-xs font-semibold text-zinc-500 uppercase tracking-wider mb-4">Stempel</p>
                    <div class="bg-zinc-200 p-3 rounded-xl shadow-inner inline-block">
                        <img id="imgStamp" src="" alt="Stempel" class="w-48 h-auto mix-blend-multiply">
                    </div>
                </div>
                <div class="flex flex-col items-center">
                    <p class="text-xs font-semibold text-zinc-500 uppercase tracking-wider mb-4">QR Ketua</p>
                    <div class="bg-zinc-200 p-3 rounded-xl shadow-inner inline-block">
                        <img id="imgKetua" src="" alt="Ketua" class="w-48 h-auto mix-blend-multiply">
                    </div>
                </div>
                <div class="flex flex-col items-center">
                    <p class="text-xs font-semibold text-zinc-500 uppercase tracking-wider mb-4">QR Sekretaris</p>
                    <div class="bg-zinc-200 p-3 rounded-xl shadow-inner inline-block">
                        <img id="imgSekretaris" src="" alt="Sekretaris" class="w-48 h-auto mix-blend-multiply">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Data Pengurus berdasarkan gambar
        const dataKetua = {
            "Ketua Umum": "A. Zulfa Laday Robbi Sholeh",
            "Ketua Satu": "M. Marzuqi Hamid",
            "Ketua Dua": "H. Nururrohman Ya'lu",
            "Ketua Tiga": "M. Yusuf Fadlulloh Abdurrohman",
            "Ketua Empat": "A. Murtadlo Waridlo",
            "Ketua Lima": "M. Faidul Haq Asyrofi"
        };

        const dataSekretaris = {
            "Sekretaris Umum": "H. Abdurrohman Kafabihi",
            "Sekretaris Satu": "Muh. Khoirun Ni'am Ali",
            "Sekretaris Dua": "Moh. 'Ainur Rofiq AB",
            "Sekretaris Tiga": "M. Zakariya Yasir",
            "Sekretaris Empat": "M. Zakkiyu Nuha Mukhsin",
            "Sekretaris Lima": "M. Khasib Afil Qorrobin Imam"
        };

        const elKetua = document.getElementById('ketua');
        const elKetuaName = document.getElementById('ketuaName');
        const elSekretaris = document.getElementById('sekretaris');
        const elSekretarisName = document.getElementById('sekretarisName');

        // Fungsi untuk update nama otomatis saat dropdown diganti
        function updateNames() {
            elKetuaName.value = dataKetua[elKetua.value];
            elSekretarisName.value = dataSekretaris[elSekretaris.value];
        }

        // Event listener saat opsi dipilih
        elKetua.addEventListener('change', updateNames);
        elSekretaris.addEventListener('change', updateNames);

        // Jalankan sekali saat halaman pertama kali dimuat
        updateNames();

        // Handle Submit API
        document.getElementById('qrForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const messageEl = document.getElementById('message');
            const resultSection = document.getElementById('resultSection');
            
            // Set loading state
            btn.disabled = true;
            btn.innerHTML = '<svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-zinc-900 inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> MEMPROSES...';
            btn.classList.add('opacity-80', 'cursor-not-allowed');
            messageEl.className = 'hidden';
            resultSection.className = 'hidden mt-10 pt-10 border-t border-zinc-800';

            // Ambil data dari form
            const payload = {
                nomorSurat: document.getElementById('nomorSurat').value,
                kodeKepengurusan: document.getElementById('kodeKepengurusan').value,
                kodeSurat: document.getElementById('kodeSurat').value,
                tingkatKepengurusan: document.getElementById('tingkatKepengurusan').value,
                daerahKepengurusan: document.getElementById('daerahKepengurusan').value,
                ketua: elKetua.value,
                ketuaName: elKetuaName.value,
                sekretaris: elSekretaris.value,
                sekretarisName: elSekretarisName.value,
            };

            try {
                const response = await fetch('/generateQR', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (data.status === 'success') {
                    // Tema Monochrome Success
                    messageEl.innerHTML = '&#10003; BERKAS BERHASIL DIGENERATE';
                    messageEl.className = 'mt-6 p-4 rounded-lg text-sm font-bold text-center tracking-widest border border-zinc-700 bg-zinc-800/50 text-white';
                    
                    document.getElementById('downloadZip').href = data.data.zipUrl;
                    document.getElementById('imgStamp').src = data.data.individual.stamp;
                    document.getElementById('imgKetua').src = data.data.individual.ketua;
                    document.getElementById('imgSekretaris').src = data.data.individual.sekretaris;
                    
                    resultSection.classList.remove('hidden');
                } else {
                    // Tema Monochrome Error
                    messageEl.innerHTML = '&#9888; GAGAL: ' + (data.message || 'TERJADI KESALAHAN').toUpperCase();
                    messageEl.className = 'mt-6 p-4 rounded-lg text-sm font-bold text-center tracking-widest border border-zinc-700 bg-zinc-900 text-zinc-300';
                }
            } catch (error) {
                messageEl.innerHTML = '&#9888; ERROR JARINGAN: ' + error.message.toUpperCase();
                messageEl.className = 'mt-6 p-4 rounded-lg text-sm font-bold text-center tracking-widest border border-zinc-700 bg-zinc-900 text-zinc-300';
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'GENERATE BERKAS';
                btn.classList.remove('opacity-80', 'cursor-not-allowed');
            }
        });
    </script>
</body>
</html>
